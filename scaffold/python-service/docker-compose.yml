# The whole local system: `make stack` (build, start, wait for health). Postgres alone, for
# running the processes from source: `make up`.
#
#   postgres -> migrate (one-shot: alembic upgrade head) -> api, worker
#
# Secrets come from .env at run time (env_file; never baked into an image). Every published
# port binds 127.0.0.1 only.
name: app

x-app-env: &app-env
  APP_DB__URL: postgresql+psycopg://app:app@postgres:5432/app
  APP_LOGGING__FORMAT: json

x-python: &python
  image: app-python:local
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - path: ${APP_ENV_FILE:-.env}
      required: false
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # 55432 on the host: 5432 is often taken by a local Postgres.
      - "127.0.0.1:${APP_PG_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *python
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *python
    command: ["uvicorn", "app.bootstrap:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:${APP_API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *python
    command: ["appctl", "worker"]
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:

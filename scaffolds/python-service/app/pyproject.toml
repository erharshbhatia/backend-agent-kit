[project]
name = "app"
version = "0.1.0"
description = "<Project> service: API, worker, CLI."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.scripts]
appctl = "app.bootstrap:run_cli"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
